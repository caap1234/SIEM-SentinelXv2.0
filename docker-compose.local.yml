# docker-compose.local.yml — Entorno de Desarrollo y Evaluación Local SentinelX SIEM
services:
  db:
    image: postgres:16
    container_name: sentinelx-db
    shm_size: "1g"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinelx_db}
      POSTGRES_USER: ${POSTGRES_USER:-sentinelx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SentinelX_Local_2026!}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinelx} -d ${POSTGRES_DB:-sentinelx_db} -h 127.0.0.1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  nats:
    image: nats:2.10-alpine
    container_name: sentinelx-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MGMT_PORT:-8222}:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: sentinelx-opensearch
    restart: unless-stopped
    environment:
      - cluster.name=sentinelx-cluster
      - node.name=sentinelx-opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
      - "9600:9600"
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":'"]
      interval: 10s
      timeout: 5s
      retries: 15

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: sentinelx-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: .
    container_name: sentinelx-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sentinelx:SentinelX_Local_2026!@db:5432/sentinelx_db}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      UPLOADED_LOGS_DIR: ${UPLOADED_LOGS_DIR:-/app/uploaded_logs}
      GEOIP_COUNTRY_DB_PATH: ${GEOIP_COUNTRY_DB_PATH:-/geoip/GeoLite2-Country.mmdb}
      GEOIP_ASN_DB_PATH: ${GEOIP_ASN_DB_PATH:-/geoip/GeoLite2-ASN.mmdb}
      ENRICH_INLINE: "${ENRICH_INLINE:-1}"
      ENRICH_CACHE_TTL: "${ENRICH_CACHE_TTL:-86400}"
      ENRICH_CACHE_MAX: "${ENRICH_CACHE_MAX:-100000}"
      RULES_RELOAD_SECONDS: "${RULES_RELOAD_SECONDS:-600}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - .:/app
      - ./geoip:/geoip:ro
    command: >
      bash -lc "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  parsing_worker:
    build:
      context: .
    container_name: sentinelx-parsing-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sentinelx:SentinelX_Local_2026!@db:5432/sentinelx_db}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      UPLOADED_LOGS_DIR: ${UPLOADED_LOGS_DIR:-/app/uploaded_logs}
      GEOIP_COUNTRY_DB_PATH: ${GEOIP_COUNTRY_DB_PATH:-/geoip/GeoLite2-Country.mmdb}
      GEOIP_ASN_DB_PATH: ${GEOIP_ASN_DB_PATH:-/geoip/GeoLite2-ASN.mmdb}
    volumes:
      - .:/app
      - ./geoip:/geoip:ro
    command: >
      bash -lc "python -m app.workers.parsing_worker_loop"

  engine_worker:
    build:
      context: .
    container_name: sentinelx-engine-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sentinelx:SentinelX_Local_2026!@db:5432/sentinelx_db}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      GEOIP_COUNTRY_DB_PATH: ${GEOIP_COUNTRY_DB_PATH:-/geoip/GeoLite2-Country.mmdb}
      GEOIP_ASN_DB_PATH: ${GEOIP_ASN_DB_PATH:-/geoip/GeoLite2-ASN.mmdb}
    volumes:
      - .:/app
      - ./geoip:/geoip:ro
    command: >
      bash -lc "python -m app.workers.engine_worker_loop"

  opensearch_worker:
    build:
      context: .
    container_name: sentinelx-opensearch-worker
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
    volumes:
      - .:/app
    command: >
      bash -lc "python -m app.workers.opensearch_indexer_worker"

  evidence_worker:
    build:
      context: .
    container_name: sentinelx-evidence-worker
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
    volumes:
      - .:/app
    command: >
      bash -lc "python -m app.workers.minio_evidence_worker"

volumes:
  pgdata:
  natsdata:
  opensearchdata:
  miniodata:
